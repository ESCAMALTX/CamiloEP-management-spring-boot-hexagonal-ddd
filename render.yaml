services:
  - type: web
    name: users-management-api
    runtime: docker
    plan: free
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /v3/api-docs
    envVars:
      # Perfil activo: PostgreSQL + correo por la API HTTPS de Brevo.
      # Render no permite SMTP saliente en el plan gratuito; Brevo usa HTTPS (443).
      - key: SPRING_PROFILES_ACTIVE
        value: postgres,brevo

      # =============================================
      # Conexion a Supabase (PostgreSQL gestionado)
      # =============================================
      # Valores a completar en el panel de Render (marcados con sync: false).
      #
      # En Supabase: Project Settings > Database > Connection string > Session pooler
      #   DB_HOST     -> aws-0-<region>.pooler.supabase.com
      #   DB_PORT     -> 5432 (se completa en el panel de Render)
      #   DB_NAME     -> postgres
      #   DB_USERNAME -> postgres.<project-ref>
      #   DB_PASSWORD -> la del proyecto (Project Settings > Database > Reset password)
      #
      # Usar el SESSION POOLER (puerto 5432), no el Transaction pooler (6543):
      # el Transaction pooler no admite sentencias preparadas con nombre.
      - key: DB_HOST
        sync: false
      # 5432 para el Session pooler; 6543 solo si el pooler lo admite.
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        value: postgres
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Supabase exige TLS. "require" cifra sin validar el certificado;
      # usar "verify-full" para validacion completa del certificado.
      - key: DB_SSL_MODE
        value: require

      # =============================================
      # Correo transaccional (Brevo, API HTTPS)
      # =============================================
      # La cuenta de Brevo debe tener verificado el remitente BREVO_FROM_ADDRESS.
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_ADDRESS
        sync: false
      - key: BREVO_FROM_NAME
        value: Gestion de Usuarios

      # =============================================
      # Seguridad JWT
      # =============================================
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_SECONDS
        value: "900"
