# =============================================
# Perfil: mysql
# =============================================
# Para activarlo: SPRING_PROFILES_ACTIVE=mysql
#
# Este perfil hace dos cosas:
#   1. DataSourceSpringConfig construye la URL jdbc:mysql://...
#   2. Spring registra el bean UserRepositoryMySQL (@Profile("mysql"))
#
# Se conserva intacto el comportamiento historico del proyecto.

db.host=${DB_HOST:localhost}
db.port=${DB_PORT:3306}
db.name=${DB_NAME:crud_usuarios}
db.username=${DB_USERNAME:root}
db.password=${DB_PASSWORD:}
db.ssl-mode=${DB_SSL_MODE:DISABLED}
