# =============================================
# Perfil: postgres
# =============================================
# Activo por defecto (ver spring.profiles.active en application.properties).
#
# Este perfil hace dos cosas:
#   1. DataSourceSpringConfig construye la URL jdbc:postgresql://...
#   2. Spring registra el bean UserRepositoryPostgres (@Profile("postgres"))
#
# Variables de entorno reconocidas (mismos nombres que en MySQL para
# facilitar el cambio de motor sin tocar el despliegue):
#   DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD, DB_SSL_MODE

# Valores por defecto para desarrollo local con PostgreSQL.
# En Supabase o Render se sobrescriben con variables de entorno.
db.host=${DB_HOST:localhost}
db.port=${DB_PORT:5432}
# Supabase crea la base "postgres" por defecto.
db.name=${DB_NAME:postgres}
db.username=${DB_USERNAME:postgres}
db.password=${DB_PASSWORD:}
# Supabase exige TLS: usar require (o verify-full para validar el certificado).
db.ssl-mode=${DB_SSL_MODE:require}
